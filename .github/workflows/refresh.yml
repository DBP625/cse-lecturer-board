name: Refresh notices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build notices.json
        env:
          FEED_URLS: ${{ secrets.FEED_URLS }}
        run: python feed_to_json.py
      - name: Commit if changed
        run: |
          git config user.name "notice-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notices.json
          git diff --cached --quiet || (git commit -m "Auto-refresh notices" && git push)
